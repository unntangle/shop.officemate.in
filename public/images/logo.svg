<!--
  Officemate wordmark, extracted from the old PHP site
  (includes/parts/header.php, where it was inline SVG rather than a file).

  Changes made in extraction, all cosmetic:
    - The <defs><style>.cls-1{fill:#ec1c24}</style></defs> block and the
      per-path class="cls-1" were replaced by a single fill on the root. A
      standalone file carrying an embedded stylesheet is a hazard: class names
      like `cls-1` are generic enough to collide with other inline SVGs on the
      same page and silently recolour them.
    - The fixed width="200px" height="21" were dropped so the file scales to
      whatever box it is given. Note those two did not match the viewBox
      aspect, so the old site was letterboxing its own logo.

  TRUE ASPECT IS 738.69 x 60.58, or 12.19:1 — much wider than logo.webp's
  roughly 8.9:1. Sizing this by height will make it noticeably wider than the
  raster it replaces. Size it by width, or check the result.
-->
